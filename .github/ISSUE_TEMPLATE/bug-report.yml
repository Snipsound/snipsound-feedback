name: Report a bug
description: Paste your SnipSound logs and briefly tell us what went wrong
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SnipSound.

        To report a bug:
        1. In SnipSound, click **Copy logs**.
        2. Paste the copied information into the **Copied SnipSound logs** field below.
        3. Tell us in one sentence what went wrong.

        The copied logs are designed to include technical session details without including your audio, video, filenames, transcription, text-to-speech input, or other personal content.

        Everything submitted here is public. Please do not add private files, passwords, API keys, personal information, or other sensitive content.

  - type: dropdown
    id: tool
    attributes:
      label: Which SnipSound tool had the problem?
      options:
        - Audio Editor
        - Video Editor
        - Text to Speech
        - Audio Transcription
        - Audio Translator
        - Audio Word Finder
        - Music Search
        - Another SnipSound page
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Describe the problem in one short sentence.
      placeholder: "Example: I clicked Export, but the download never started."
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Copied SnipSound logs
      description: Click Copy logs in SnipSound, then paste the copied information here.
      placeholder: Paste the copied SnipSound logs here.
      render: text
    validations:
      required: true
