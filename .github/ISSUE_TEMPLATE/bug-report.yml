name: Report a bug
description: Tell us about something that is not working correctly in SnipSound
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SnipSound.

        Everything submitted here is public. Do not include private audio or video, transcription or text-to-speech content, passwords, API keys, access tokens, cookies, personal information, private URLs, or files you do not have permission to share.

        Do not report security vulnerabilities through this public form. Follow the instructions in SECURITY.md instead.

  - type: dropdown
    id: tool
    attributes:
      label: Which SnipSound tool were you using?
      options:
        - Audio Editor
        - Video Editor
        - Text to Speech
        - Audio Transcription
        - Audio Translator
        - Audio Word Finder
        - Music Search
        - Another SnipSound page
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Briefly describe the problem and what you were doing immediately before it occurred.
      placeholder: I uploaded an MP3 and clicked Export. The export stopped at 99%.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe the expected result when it is not obvious.

  - type: textarea
    id: diagnostics
    attributes:
      label: SnipSound diagnostic report
      description: In SnipSound, click Copy Diagnostic Report and paste it here. The report should contain technical session details but no audio, entered text, or other personal content.
      placeholder: Paste the copied SnipSound diagnostic report here.
      render: text

  - type: input
    id: environment
    attributes:
      label: Browser and device, if diagnostics are unavailable
      description: Leave this blank when the diagnostic report already includes it.
      placeholder: Example: Chrome on Windows 11, or Safari on iPhone

  - type: textarea
    id: reproduction
    attributes:
      label: Additional steps to reproduce, if known
      description: Add any steps that would help us make the problem happen again. This is optional when the diagnostic report and description are sufficient.
      placeholder: |
        1. Open...
        2. Upload or select...
        3. Click...
        4. See the problem...

  - type: textarea
    id: media
    attributes:
      label: Screenshot or screen recording
      description: Drag files here only after confirming they contain no private or sensitive information.

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
      description: Add any other non-sensitive information that may help us investigate.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this report and removed private or sensitive information.
          required: true
