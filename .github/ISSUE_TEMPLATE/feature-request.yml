name: Suggest a feature
description: Suggest an improvement or a new capability for SnipSound
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea for SnipSound.

        Everything submitted here is public. Do not include private audio or video, transcription or text-to-speech content, personal information, passwords, API keys, access tokens, cookies, private URLs, or confidential business information.

  - type: dropdown
    id: tool
    attributes:
      label: Which part of SnipSound is this related to?
      options:
        - Audio Editor
        - Video Editor
        - Text to Speech
        - Audio Transcription
        - Audio Translator
        - Audio Word Finder
        - Music Search
        - A new tool
        - General website experience
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to accomplish and why the current workflow is difficult.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like SnipSound to do?
      description: Describe how the feature should work from a user's perspective.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What alternatives have you tried?
      description: Describe any workarounds or other tools you currently use.

  - type: textarea
    id: examples
    attributes:
      label: Examples or references
      description: Mention products or workflows that demonstrate the idea. Do not include private or sensitive links.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other non-sensitive information that would help explain the request.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues to see whether this feature was already requested.
          required: true
        - label: I reviewed this request and removed private or sensitive information.
          required: true
