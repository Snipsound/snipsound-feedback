name: Share feedback
description: Tell us what worked well or what could be improved in SnipSound
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing feedback about SnipSound.

        Everything submitted here is public. Do not include private audio or video, transcription or text-to-speech content, passwords, API keys, access tokens, cookies, personal information, private URLs, or confidential business information.

  - type: dropdown
    id: tool
    attributes:
      label: Which part of SnipSound is this about?
      options:
        - Audio Editor
        - Video Editor
        - Text to Speech
        - Audio Transcription
        - Audio Translator
        - Audio Word Finder
        - Music Search
        - General website experience
        - Other
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: Tell us what worked well, what was confusing, or what could be improved.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other non-sensitive details that would help us understand your experience.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this feedback and removed private or sensitive information.
          required: true
